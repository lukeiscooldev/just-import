name: Android CI - Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK with Gradle
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          FILE_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Pack-Importer-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Generate Build Summary
        run: |
          echo "### 🚀 Android Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** \`Minecraft-Pack-Importer-APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Path:** \`${{ steps.find_apk.outputs.apk_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size:** \`${{ steps.find_apk.outputs.apk_size }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner Specs:** Ubuntu Latest (4 vCPUs, 16 GB RAM) - *No local RAM needed!*" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### How to install on your phone:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Summary** tab of this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "2. Under **Artifacts**, download \`Minecraft-Pack-Importer-APK\` (zip)." >> $GITHUB_STEP_SUMMARY
          echo "3. Extract the ZIP to get \`app-debug.apk\`." >> $GITHUB_STEP_SUMMARY
          echo "4. Send to your Android phone via USB, Google Drive, or Discord." >> $GITHUB_STEP_SUMMARY
          echo "5. Tap the APK file on your phone and choose **Install**." >> $GITHUB_STEP_SUMMARY
